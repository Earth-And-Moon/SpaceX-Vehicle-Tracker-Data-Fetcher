name: Data Fetcher V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pause-job:
    runs-on: ubuntu-latest
    environment:
      name: wait-180
      deployment: false
    steps:
      - name: Wait time end
        run: echo "End of waiting. Beginning logging."

  log_data:
    needs:
      pause-job
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # Erzwingt, dass immer nur ein Job gleichzeitig läuft
      matrix:
        run_number: [1, 2, 3, 4, 5]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests

    - name: Initialize stuff
      run: |
        git config --global user.name "Data-Logger-Bot"
        git config --global user.email "bot@github.com"

    - name: Run script
      run: python script.py

    - name: Push data file
      run: |
        git add data/data.txt
        git commit -m "Data update" || exit 0
        git push



